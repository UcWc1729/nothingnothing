/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1
        max_iteration: 3
        filter_size_surf: 0.05
        filter_size_map: 0.05
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/lidar_points"
            imu_topic:  "/imu"
            # 仿真下 lidar/imu 同源时钟，关闭时间同步避免错位
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0 

        preprocess:
            # 0 = default_handler，适用于仅含 x,y,z（或 x,y,z,intensity）的 PointCloud2；仿真点云无 reflectivity/line
            lidar_type: 0
            scan_line:  96
            timestamp_unit: 3
            scan_rate: 20

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     89.5
            # 仿真用固定外参，关闭估计避免“No Effective Points”
            extrinsic_est_en: false
            extrinsic_T: [0.32057, 0.0, -0.11732]
            extrinsic_R: [  -0.9802,    0.,     0.1980,
                            0.,         1.,     0.,
                            -0.1980,    0.,     -0.9802]

        publish:
            path_en: true        
            effect_map_en: false   
            map_en: true        
            scan_publish_en:  true       
            dense_publish_en: false      
            scan_bodyframe_pub_en: true  

        pcd_save:
            pcd_save_en: false
            interval: -1                 